<app-breadcrumb [title]="'Faqs'" [items]="['Dashboard']" [active_item]="'Faqs'"
    icon="list"></app-breadcrumb>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12 btnPadding">
            <div class="card card-premium">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5>All Faqs</h5>
                    <button class="btn btn-premium btn-sm" (click)="open('add')">
                        <i class="fa fa-plus"></i> Add Faq
                    </button>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-sm-6 d-flex justify-content-start align-items-center mb-4">
                            <div class="search-premium w-100">
                                <i class="fa fa-search"></i>
                                <input type="text" [(ngModel)]="searchInput" placeholder="Search faqs..."
                                    class="w-100" />
                            </div>
                        </div>
                        <div class="col-sm-12 mb-4">
                            <div class="table-premium-container table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">Id</th>
                                            <th scope="col">Question</th>
                                            <th scope="col">Answer</th>
                                            <th scope="col">Status</th>
                                            <th scope="col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ng-container *ngIf="(faqs | filter : searchInput)?.length; else noData">
                                            <tr
                                                *ngFor="let item of faqs | filter : searchInput | paginate : { itemsPerPage: 5, currentPage: duePage, totalItems: total }; let i = index">
                                                <th scope="row">{{ item?.id }}</th>
                                                <td>{{ item?.question }}</td>
                                                <td>{{ item?.answer }}</td>

                                               
                                                <td>
                                                    <div
                                                        class="toggle d-flex align-items-center w-100 justify-content-center">
                                                        <input (change)="updateStatus($event, item)" class="checkBox"
                                                            type="checkbox" [checked]="item?.status == '1'"
                                                            [id]="'cat' + i" />
                                                        <label [for]="'cat' + i"></label>
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="btn-group">
                                                        <button class="btn btn-glass btn-sm" placement="top"
                                                            (click)="selectedFaq = item; open('edit')"
                                                            title="Edit">
                                                            <i class="fa fa-edit text-primary"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        </ng-container>
                                        <ng-template #noData>
                                            <tr *ngIf="faqs?.length">
                                                <td colspan="5" class="text-center white">
                                                    No Matching Data Available
                                                </td>
                                            </tr>
                                        </ng-template>
                                        <tr *ngIf="!faqs?.length">
                                            <td class="text-center white" colspan="5">
                                                No data available
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="col-sm-12 d-flex justify-content-end mt-4" *ngIf="faqs?.length">
                            <pagination-controls (pageChange)="duePage = $event"></pagination-controls>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Side Drawer -->
<div class="side-drawer" [class.open]="isDrawerOpen">
    <div class="drawer-header d-flex justify-content-between align-items-center">
        <h3>{{state ? 'Edit FAQ' : 'Add FAQ'}}</h3>
        <button class="btn-close" (click)="proceed()"></button>
    </div>
    <div class="drawer-body custom-scrollbar">
        <form [formGroup]="editForm" class="form">
            <div class="row">
                <div class="col-lg-12 mb-3">
                    <label>Question</label>
                    <input formControlName="question" type="text" placeholder="Question" class="form-control" />
                    <div
                        *ngIf="editForm.controls['question'].invalid && (editForm.controls['question'].dirty || editForm.controls['question'].touched)">
                        <small class="text-danger">Question is required</small>
                    </div>
                </div>

                           <div class="col-lg-12 mb-3">
                    <label>Answer</label>
                    <input formControlName="answer" type="text" placeholder="Answer" class="form-control" />
                    <div
                        *ngIf="editForm.controls['answer'].invalid && (editForm.controls['answer'].dirty || editForm.controls['answer'].touched)">
                        <small class="text-danger">Answer is required</small>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="drawer-footer">
        <button class="btn btn-primary w-100 mb-2" (click)="save()">Save Changes</button>
        <button class="btn btn-outline-secondary w-100" (click)="proceed()">Cancel</button>
    </div>
</div>

<div class="drawer-backdrop" *ngIf="isDrawerOpen" (click)="proceed()"></div>
