<app-breadcrumb [title]="'Settings'" [items]="['Dashboard']" [active_item]="'Settings'"
  icon="settings"></app-breadcrumb>

<div class="container-fluid">
  <div class="row">

    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h3 style="text-align: center; font-weight: 600; font-size: 33px; letter-spacing: 2px;">App Urls</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="settingForm" class="theme-form">
            <div class="form-group">
              <label class="col-form-label">Android App Url</label>
              <div class="input-group">
                <input class="form-control" type="text" required="" placeholder="Android Url"
                  formControlName="android_url" />
              </div>
              <div *ngIf="settingForm.controls.android_url.invalid &&
                    (settingForm.controls.android_url.dirty ||
                      settingForm.controls.android_url.touched)">
                <small class="text-danger">Android App Url is required</small>
              </div>
            </div>

            <div class="form-group">
              <label class="col-form-label">iOS App Url</label>
              <div class="input-group">
                <input class="form-control" type="text" required="" placeholder="Ios Url" formControlName="ios_url" />
              </div>
              <div *ngIf="settingForm.controls.ios_url.invalid &&
                (settingForm.controls.ios_url.dirty ||
                  settingForm.controls.ios_url.touched)">
                <small class="text-danger">iOS App Url is required</small>
              </div>
            </div>

            <div class="form-group">
              <label class="col-form-label">Email</label>
              <div class="input-group">
                <input class="form-control" type="email" required="" placeholder="Email" formControlName="email" />
              </div>
              <div *ngIf="settingForm.controls.email.invalid &&
                (settingForm.controls.email.dirty ||
                  settingForm.controls.email.touched)">
                <small class="text-danger">Email is required</small>
              </div>
            </div>

            <div class="form-group row">
              <div class="col-md-6">
                <label class="col-form-label">Admin Percent</label>
                <div class="input-group">
                  <input class="form-control" type="number" required="" placeholder="Admin Percent"
                    formControlName="admin_percent" min="0" max="100" (input)="updateDriverPercent()" />
                  <div class="input-group-append">
                    <span class="input-group-text">%</span>
                  </div>
                </div>
                <div *ngIf="settingForm.controls.admin_percent.invalid &&
                          (settingForm.controls.admin_percent.dirty || settingForm.controls.admin_percent.touched)">
                  <small class="text-danger">Admin Percent is required</small>
                </div>
              </div>

              <div class="col-md-6">
                <label class="col-form-label">Driver Percent</label>
                <div class="input-group">
                  <input class="form-control" type="number" required="" placeholder="Driver Percent"
                    formControlName="driver_percent" min="0" max="100" readonly />
                  <div class="input-group-append">
                    <span class="input-group-text">%</span>
                  </div>
                </div>
                <div *ngIf="settingForm.controls.driver_percent.invalid &&
                          (settingForm.controls.driver_percent.dirty || settingForm.controls.driver_percent.touched)">
                  <small class="text-danger">Driver Percent is required</small>
                </div>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>

    <div class="col-sm-3 mt-3 ml-auto">
      <button class="btn btn-primary btn-block" [disabled]="!settingForm.valid" (click)="saveSetting()" type="button">
        <span>Save</span>
      </button>
    </div>
  </div>
</div>
